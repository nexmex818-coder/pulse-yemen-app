name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Gradle
        run: |
          npm install -g cordova
          # تثبيت إصدار Gradle محدد لضمان التوافق مع مشروعك
          wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
          sudo unzip -d /opt/gradle gradle-8.0-bin.zip
          echo "PATH=$PATH:/opt/gradle/gradle-8.0/bin" >> $GITHUB_ENV

      - name: Prepare Platform
        run: |
          cordova platform add android@12.0.0 --no-telemetry
          # إجبار المشروع على استخدام الإصدار الصحيح من الـ Wrapper
          cd platforms/android && gradle wrapper --gradle-version 8.0

      - name: Build APK
        run: |
          # البناء مع تجاوز فحص التوقيع الرقمي لإنتاج APK مباشر
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-Final
          path: platforms/android/app/build/outputs/apk/release/*.apk
