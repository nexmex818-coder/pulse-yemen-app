name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # هذه الخطوة ستحل مشكلة الـ Gradle نهائياً
          cache: 'gradle'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK
        run: |
          # تنظيف أي مخلفات قديمة
          rm -rf platforms/android
          rm -rf plugins
          
          # إضافة المنصة وبناء الـ APK
          cordova platform add android@12.0.0 --no-telemetry
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-App
          path: platforms/android/app/build/outputs/apk/release/*.apk
