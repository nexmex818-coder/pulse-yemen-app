name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Platform and Fix Gradle
        run: |
          cordova platform add android@12.0.0 --no-telemetry
          # هذا السطر يحل مشكلة الـ Wrapper التي ظهرت لك
          cd platforms/android && ./gradlew clean || true

      - name: Build APK
        run: |
          # بناء APK مباشر وتجنب طلبات التوقيع الرقمي
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-Fixed
          path: platforms/android/app/build/outputs/apk/release/*.apk
