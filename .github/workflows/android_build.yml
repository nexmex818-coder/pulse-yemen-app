name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Fix Config
        run: |
          npm install -g cordova
          # التأكد من وجود ملف config صحيح إذا كان الحالي به خطأ
          if [ ! -f "config.xml" ]; then
            cordova create tmp_app com.nexmex.pulse PulseYemen
            cp tmp_app/config.xml .
            rm -rf tmp_app
          fi

      - name: Build APK
        run: |
          cordova platform add android@12.0.0 --no-telemetry
          # بناء APK عادي بدلاً من Bundle لتجنب أخطاء التوقيع
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-App
          path: platforms/android/app/build/outputs/apk/release/*.apk
