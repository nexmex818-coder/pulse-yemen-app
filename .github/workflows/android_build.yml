name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # يجبر الـ Actions تشتغل على Node.js 24 بدل 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود من المستودع
      - uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. تثبيت Cordova
      - name: Install Cordova
        run: npm install -g cordova

      # 5. تنظيف المنصة القديمة
      - name: Clean old Android platform
        run: rm -rf platforms/android

      # 6. إضافة منصة أندرويد جديدة
      - name: Add Android platform
        run: cordova platform add android@12.0.0 --no-telemetry

      # 7. تثبيت Gradle 8.5 وتعطيل الكاش
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          cache-disabled: true

      # 8. توليد Gradle Wrapper داخلي
      - name: Generate Gradle Wrapper
        run: |
          cd platforms/android
          gradle wrapper --gradle-version 8.5
          cd ../..

      # 9. بناء الـ APK
      - name: Build APK
        run: cordova build android --release -- --packageType=apk

      # 10. رفع الـ APK الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-App
          path: platforms/android/app/build/outputs/apk/release/*.apk
