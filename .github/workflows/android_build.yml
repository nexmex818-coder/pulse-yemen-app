name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Manual Gradle Installation
        run: |
          # تحميل وتثبيت Gradle 8.0 يدوياً لتجنب النسخة 9.4.1 الفاشلة
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          sudo unzip -q -d /opt/gradle gradle-8.0-bin.zip
          echo "/opt/gradle/gradle-8.0/bin" >> $GITHUB_PATH

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Android Platform
        run: |
          # إجبار المشروع على استخدام Gradle 8.0
          cordova platform add android@12.0.0 --no-telemetry
          cd platforms/android && gradle wrapper --gradle-version 8.0

      - name: Build Final APK
        run: |
          # البناء مع تجاوز فحص التوقيع الرقمي
          cordova build android --release -- --packageType=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulse-Yemen-Build
          path: platforms/android/app/build/outputs/apk/release/*.apk
          
